#cover:focus-visible{outline:4px solid #ff5fa2;outline-offset:-8px}

      new THREE.MeshBasicMaterial({color:outer?0xffffff:0xffc857,side:THREE.DoubleSide}));
    border.position.z=-0.004;
    const photo=new THREE.Mesh(outer?new THREE.PlaneGeometry(w,h):new THREE.CircleGeometry(w/2,40),new THREE.MeshBasicMaterial({color:0x888888}));
    if(photos.length)applyTex(photo,photos[i%photos.length],w/h);
    else{photo.material.map=emojiTex(i,w,h);photo.material.color.set(0xffffff)}
    g.add(border,photo);g.visible=false;return g;
  }
  function build(){
    cards.forEach(c=>c.parent&&c.parent.remove(c));
    cards=[];
    const dummy=new THREE.Object3D();
    for(let i=0;i<N+M;i++){
      const outer=i<N,k=outer?i:i-N,cnt=outer?N:M,R=outer?4.2:2.6,a=k*Math.PI*2/cnt;
      const c=makeCard(i,outer);
      const p=new THREE.Vector3(R*Math.cos(a),(outer?0.35:0.2)*Math.sin(a*2+k),R*Math.sin(a));
      dummy.position.copy(p);dummy.lookAt(p.x*2,p.y,p.z*2);
      c.userData={outer,ring:outer?outerG:innerG,pos:p,quat:dummy.quaternion.clone()};
      cards.push(c);
    }
  }
  function seat(c){const u=c.userData;c.position.copy(u.pos);c.quaternion.copy(u.quat);c.scale.setScalar(1);u.ring.add(c);c.visible=true}

  async function flyIn(c,i,my){
    scene.add(c);c.visible=true;camera.updateMatrixWorld();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion),right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const d=7,spotPos=camera.position.clone().addScaledVector(fwd,d);
    const vh=Math.tan(camera.fov*Math.PI/360)*d,vw=vh*camera.aspect;
    const sc=Math.min(vw*1.6/1.2,vh*1.4/1.6),dir=i%2?1:-1;
    const startPos=spotPos.clone().addScaledVector(right,dir*vw*2.4),spotQ=camera.quaternion.clone(),startQ=spotQ.clone().multiply(Qy(dir*0.9));
    $('cap').textContent=caps[i%caps.length];
    $('cap').animate([{opacity:0},{opacity:1,offset:.3},{opacity:1,offset:.8},{opacity:0}],{duration:2600,fill:'forwards'});
    await tween(0.65,t=>{c.position.lerpVectors(startPos,spotPos,t);c.scale.setScalar(0.2+(sc-0.2)*t);c.quaternion.copy(qs(startQ,spotQ,t))});
    if(my!==token)return;
    await tween(1.0,(t,p)=>{c.position.copy(spotPos);c.position.y+=0.08*Math.sin(p*6.283);c.quaternion.copy(spotQ).multiply(Qy(0.18*Math.sin(p*6.283)))},t=>t);
    if(my!==token)return;
    const u=c.userData,tq=new THREE.Quaternion(),tp=new THREE.Vector3();
    await tween(0.9,t=>{
      world.updateMatrixWorld(true);u.ring.getWorldQuaternion(tq);tq.multiply(u.quat);tp.copy(u.pos);u.ring.localToWorld(tp);
      c.position.lerpVectors(spotPos,tp,t);c.scale.setScalar(sc+(1-sc)*t);c.quaternion.copy(qs(spotQ,tq,t));
    });
    if(my!==token)return;
    seat(c);
  }

  async function play(){
    const my=++token;done=false;tweens=[];build();heroS=0.001;
    $('msg').classList.remove('on');$('hint').classList.remove('on');$('go').classList.remove('on');
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){finish(my);return}
    await wait(600);
    for(let i=0;i<N;i++){if(my!==token)return;await flyIn(cards[i],i,my);if(my!==token)return;await wait(150)}
    for(let k=N;k<N+M;k++){
      if(my!==token)return;const c=cards[k];c.userData.ring.add(c);c.position.copy(c.userData.pos);c.quaternion.copy(c.userData.quat);c.scale.setScalar(0.01);c.visible=true;
      tween(0.7,t=>c.scale.setScalar(0.01+0.99*t));await wait(220);
    }
    await wait(500);finish(my);
  }
  function finish(my){
    if(my!==undefined&&my!==token)return;
    token++;done=true;tweens=[];
    cards.forEach(seat);
    $('cap').getAnimations().forEach(a=>a.cancel());$('cap').style.opacity=0;
    tween(1.2,t=>{heroS=0.001+t},t=>1-Math.pow(1-t,3));
    $('msg').classList.add('on');$('hint').classList.add('on');$('go').classList.add('on');confetti();
    
  }
  window._play=play;window._finish=finish;

  // drag to rotate
  let drag=false,lx=0,ly=0,spin=0.0025;
  const gl=$('gl');
  gl.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;gl.setPointerCapture(e.pointerId)});
  gl.addEventListener('pointermove',e=>{if(!drag)return;world.rotation.y+=(e.clientX-lx)*0.008;world.rotation.x=Math.max(-0.8,Math.min(0.8,world.rotation.x+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY});
  const up=()=>{drag=false};gl.addEventListener('pointerup',up);gl.addEventListener('pointercancel',up);

  const clock=new THREE.Clock();
  function loop(){
    requestAnimationFrame(loop);
    const now=performance.now(),t=clock.getElapsedTime();
    for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i],p=Math.min(1,(now-tw.t0)/tw.dur);tw.fn(tw.ease(p),p);if(p>=1){tweens.splice(i,1);tw.res()}}
    if(!drag){world.rotation.y+=spin;world.rotation.x*=0.97}
    outerG.rotation.y+=0.004;innerG.rotation.y-=0.007;window._stars.rotation.y+=0.0003;
    heroG.quaternion.copy(camera.quaternion);heroG.scale.setScalar(heroS*(1+0.04*Math.sin(t*2.6)));
    renderer.render(scene,camera);
  }
  loop();play();

}

// ui

const cv=$('cv'),cx=cv.getContext('2d');let bits=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.y+=b.v;b.x+=b.dx;b.a+=b.da;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;cx.fillRect(-4,-2,8,4);cx.restore()});
  bits=bits.filter(b=>b.y<cv.height+20);raf=bits.length?requestAnimationFrame(tick):0;
}
function confetti(){
  for(let i=0;i<180;i++)bits.push({x:Math.random()*cv.width,y:-10-Math.random()*200,v:2+Math.random()*4,dx:Math.random()*2-1,a:0,da:Math.random()*.2,c:'hsl('+Math.random()*360+',90%,60%)'});
  if(!raf)tick();
}


function fallback(err){
  const n=$('nogl');n.hidden=false;n.style.padding='0';n.style.display='block';
  n.innerHTML='';const f=document.createElement('iframe');
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
  f.srcdoc=SIMPLE;n.appendChild(f);console.error(err);
}


// cover page: click anywhere to open the box, then the gallery starts
$('cpic').style.backgroundImage="url('"+MY_PHOTOS[0]+"')";
$('ccap').textContent="Click anywhere to open "+NAME+"'s Birthday Box! ✨🎁";
let started=false;
function openBox(){
  if(started)return;started=true;startMusic();$('cover').classList.add('gone');setTimeout(()=>$('cover').remove(),750);
  try{if(!window.THREE)throw new Error('three missing');main()}catch(err){fallback(err)}
}
$('cover').addEventListener('click',openBox);
$('cover').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBox()}});

// pages after the gallery: 0 = wall of frames
const PAGES=[PAGE_WALL];let cur=-1;
$('go').addEventListener('click',()=>goto(0));
function goto(i){
  const o=document.getElementById('p2');if(o)o.remove();
  if(i<0||i>=PAGES.length){cur=-1;return}cur=i;
  const f=document.createElement('iframe');f.id='p2';f.title='Page '+(i+3);
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:#0b0820';
  f.srcdoc=PAGES[i].split('__PHOTOS__').join(JSON.stringify(MY_PHOTOS)).split('__NAME__').join(NAME);document.body.appendChild(f);
}

addEventListener('message',e=>{if(e.data==='nav:next')goto(cur+1);else if(e.data==='nav:back')goto(cur-1)});
// music: a soft music box tune made in the browser (starts on the first click)
let mAc,mOn=false,mTimer,mAudio;
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
function note(f,t,d){for(const[m,v]of[[1,.12],[2,.04]]){const o=mAc.createOscillator(),g=mAc.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,.5)+.6);o.connect(g);g.connect(mAc.destination);o.start(t);o.stop(t+d+1.2)}}
function playSong(){if(!mOn)return;let t=mAc.currentTime+.1;for(const[f,d]of SONG){note(f,t,d*.55);t+=d*.55}mTimer=setTimeout(playSong,(t-mAc.currentTime+2.5)*1000)}
function startMusic(){mOn=true;if(MUSIC_URL){mAudio=mAudio||Object.assign(new Audio(MUSIC_URL),{loop:true});mAudio.play().catch(()=>{})}else{mAc=new(window.AudioContext||window.webkitAudioContext)();playSong()}$('mus').style.display='block';$('mus').textContent='🔊'}
function stopMusic(){mOn=false;clearTimeout(mTimer);if(mAudio)mAudio.pause();if(mAc){mAc.close();mAc=null}}
$('mus').onclick=()=>{if(mOn){stopMusic();$('mus').textContent='🔇'}else startMusic()};


</script>
